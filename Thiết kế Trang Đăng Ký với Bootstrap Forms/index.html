
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký tài khoản</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS tùy chỉnh -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="registration-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-7 col-xl-6">

                    <div class="registration-card">
                        <!-- Tiêu đề -->
                        <div class="text-center mb-4">
                            <div class="registration-icon">👤</div>

                            <h1 class="h2 fw-bold">Tạo tài khoản</h1>

                            <p class="text-muted mb-0">
                                Điền thông tin bên dưới để đăng ký
                            </p>
                        </div>

                        <!-- Thông báo kết quả -->
                        <div
                            id="formMessage"
                            class="alert d-none"
                            role="alert"
                            aria-live="polite"
                        ></div>

                        <!-- Form đăng ký -->
                        <form id="registrationForm">

                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Họ và tên <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    name="fullName"
                                    placeholder="Nhập họ và tên"
                                    autocomplete="name"
                                    required
                                    minlength="2"
                                >
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="example@email.com"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <!-- Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Mật khẩu <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Nhập mật khẩu"
                                    autocomplete="new-password"
                                    minlength="8"
                                    required
                                >

                                <div class="form-text">
                                    Mật khẩu cần có ít nhất 8 ký tự.
                                </div>
                            </div>

                            <!-- Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Xác nhận mật khẩu
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Nhập lại mật khẩu"
                                    autocomplete="new-password"
                                    minlength="8"
                                    required
                                >

                                <div id="passwordFeedback" class="form-text"></div>
                            </div>

                            <!-- Giới tính -->
                            <fieldset class="mb-3">
                                <legend class="form-label fs-6">
                                    Giới tính
                                    <span class="text-danger">*</span>
                                </legend>

                                <div class="d-flex flex-wrap gap-4">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="male"
                                            value="Nam"
                                            required
                                        >
                                        <label class="form-check-label" for="male">
                                            Nam
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="female"
                                            value="Nữ"
                                        >
                                        <label class="form-check-label" for="female">
                                            Nữ
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="other"
                                            value="Khác"
                                        >
                                        <label class="form-check-label" for="other">
                                            Khác
                                        </label>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Sở thích -->
                            <fieldset class="mb-3">
                                <legend class="form-label fs-6">
                                    Sở thích
                                </legend>

                                <div class="d-flex flex-wrap gap-3">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="hobbies"
                                            id="technology"
                                            value="Công nghệ"
                                        >
                                        <label class="form-check-label" for="technology">
                                            Công nghệ
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="hobbies"
                                            id="sports"
                                            value="Thể thao"
                                        >
                                        <label class="form-check-label" for="sports">
                                            Thể thao
                                        </label>
                                    </div>

                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="hobbies"
                                            id="music"
                                            value="Âm nhạc"
                                        >
                                        <label class="form-check-label" for="music">
                                            Âm nhạc
                                        </label>
                                    </div>
                                </div>
                            </fieldset>

                            <!-- Quốc gia -->
                            <div class="mb-4">
                                <label for="country" class="form-label">
                                    Quốc gia <span class="text-danger">*</span>
                                </label>

                                <select
                                    class="form-select"
                                    id="country"
                                    name="country"
                                    required
                                >
                                    <option value="" selected disabled>
                                        -- Chọn quốc gia --
                                    </option>
                                    <option value="Việt Nam">Việt Nam</option>
                                    <option value="Lào">Lào</option>
                                    <option value="Thái Lan">Thái Lan</option>
                                    <option value="Singapore">Singapore</option>
                                    <option value="Nhật Bản">Nhật Bản</option>
                                    <option value="Hàn Quốc">Hàn Quốc</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>

                            <!-- Nút Submit -->
                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100"
                            >
                                Đăng ký
                            </button>

                            <p class="text-muted text-center small mt-3 mb-0">
                                Các trường có dấu
                                <span class="text-danger">*</span>
                                là bắt buộc.
                            </p>
                        </form>
                    </div>

                    <p class="text-center text-muted small mt-4">
                        &copy; 2026 Registration Form
                    </p>

                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
